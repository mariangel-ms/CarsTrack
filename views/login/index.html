<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarsTrack</title>
    <!-- Aquí puedes enlazar tus estilos o Tailwind -->
    <link rel="stylesheet" href="./styles.css">
    <!-- Axios para manejar la petición al backend -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js" defer></script>
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
          <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700&family=Special+Gothic+Expanded+One&display=swap"
      rel="stylesheet"
    />
  </head>

    <!-- Tu script de JS para controlar el formulario -->
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="notification"></div>
    <div id="navbar"></div>

    <main class="login-container">
        <section class="login-card">
                    <header class="login-header">
                <h1 class="brand-title">Inicio de sesion</h1>
            </header>
            <!-- Formulario de inicio de sesión -->
            <form id="admin-login-form" novalidate>
                
                <!-- Campo de Correo Electrónico -->
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="admin@motortrack.com" 
                        required
                        autocomplete="email"
                    >
                </div>

                <!-- Campo de Contraseña -->
                <div class="form-group">
                    <div class="label-wrapper">
                        <label for="password">Contraseña</label>
                    </div>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••" 
                        required
                        autocomplete="current-password"
                    >
                </div>

                <!-- Botón de Envío -->
                <button type="submit" id="submit-btn" class="btn-primary">
                    Ingresar al Panel
                </button>

            </form>
        </section>

    </main>
    <script type="module" src="index.js"></script>
    <script src="/components/nav.js"></script>
    <script type="module" src="/components/notification.js"></script>
</body>
</html>
