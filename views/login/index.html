<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Login</title>
    <!-- Aquí puedes enlazar tus estilos o Tailwind -->
    <link rel="stylesheet" href="./styles.css">
    <!-- Axios para manejar la petición al backend -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js" defer></script>
    <!-- Tu script de JS para controlar el formulario -->
<link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="login-container">
                    <header class="login-header">
                <h1 class="brand-title">Inicio de sesion</h1>
            </header>
        <section class="login-card">

            <!-- Formulario de inicio de sesión -->
            <form id="admin-login-form" novalidate>
                
                <!-- Campo de Correo Electrónico -->
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="admin@motortrack.com" 
                        required
                        autocomplete="email"
                    >
                </div>

                <!-- Campo de Contraseña -->
                <div class="form-group">
                    <div class="label-wrapper">
                        <label for="password">Contraseña</label>
                    </div>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••" 
                        required
                        autocomplete="current-password"
                    >
                </div>

                <!-- Botón de Envío -->
                <button type="submit" id="submit-btn" class="btn-primary">
                    Ingresar al Panel
                </button>

            </form>

            <!-- Contenedor dinámico para mostrar errores o alertas -->
            <div id="notification" class="notification hidden" role="alert"></div>
        </section>
    </main>
    <script src="index.js"></script>
</body>
</html>
